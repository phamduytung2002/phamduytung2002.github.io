<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. Instant HTML Meta Redirect -->
    <meta http-equiv="refresh" content="0; url=https://phamduytung2002.com">
    
    <!-- 2. JavaScript Fallback (if meta refresh fails) -->
    <script type="text/javascript">
        window.location.href = "https://phamduytung2002.com";
    </script>
</head>
<body>
    <!-- 3. Manual Fallback Link -->
    <p>If you are not redirected automatically, follow this <a href="https://phamduytung2002.com">link to the new page</a>.</p>
</body>
</html>
